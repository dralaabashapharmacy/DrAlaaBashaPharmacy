<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alaa Basha Pharmacy</title>

    <!-- Font Awesome - Real Social Media Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            /* BACKGROUND IMAGE */
            background-image:
                linear-gradient(rgba(255,255,255,0.35), rgba(255,255,255,0.35)),
                url("58EDA103-ECF6-4AAC-BC7B-0AF4D7167867.jpeg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 430px;

            background: rgba(255,255,255,0.92);

            border-radius: 30px;

            padding: 35px 25px;

            text-align: center;

            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        h1 {
            color: #168c70;
            font-size: 30px;
            margin-bottom: 8px;
            direction: ltr;
        }

        .arabic-title {
            color: #333;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .button {
            width: 100%;
            height: 58px;

            margin: 12px 0;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            text-decoration: none;

            color: white;

            font-size: 18px;
            font-weight: bold;

            transition: 0.2s;

            direction: ltr;
        }

        .button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .button i {
            font-size: 25px;
        }

        /* FACEBOOK */
        .facebook {
            background: #1877F2;
        }

        /* INSTAGRAM */
        .instagram {
            background: linear-gradient(
                45deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5
            );
        }

        /* WHATSAPP */
        .whatsapp {
            background: #25D366;
        }

        /* TIKTOK */
        .tiktok {
            background: #111111;
        }

        /* LOCATION */
        .location {
            background: #168c70;
        }

        .footer {
            margin-top: 22px;
            color: #888;
            font-size: 13px;
        }

    </style>
</head>

<body>

    <div class="card">

        <h1>Alaa Basha Pharmacy</h1>

        <div class="arabic-title">
            صيدلية د/ آلاء باشا
        </div>

        <div class="subtitle">
            تواصل معنا
        </div>


        <!-- FACEBOOK -->
        <a class="button facebook"
           href="https://www.facebook.com/share/1DUipHWA5V/?mibextid=wwXIfr"
           target="_blank">

            <i class="fa-brands fa-facebook-f"></i>

            <span>Facebook</span>

        </a>


        <!-- INSTAGRAM -->
        <a class="button instagram"
           href="https://www.instagram.com/alaabasha.pharmacy?igsi=MXg5bDkwbDl6c2l6OQ%3D%3D&utm_source=qr"
           target="_blank">

            <i class="fa-brands fa-instagram"></i>

            <span>Instagram</span>

        </a>


        <!-- WHATSAPP -->
        <a class="button whatsapp"
           href="https://wa.me/201515112492"
           target="_blank">

            <i class="fa-brands fa-whatsapp"></i>

            <span>WhatsApp</span>

        </a>


        <!-- TIKTOK -->
        <a class="button tiktok"
           href="https://www.tiktok.com/@dr.alaabasha.phar?_r=1&_t=ZS-99XmFtr2HmG"
           target="_blank">

            <i class="fa-brands fa-tiktok"></i>

            <span>TikTok</span>

        </a>


        <!-- LOCATION -->
        <a class="button location"
           href="https://maps.app.goo.gl/DKWUxaxfdM81VhDk7?g_st=ic"
           target="_blank">

            <i class="fa-solid fa-location-dot"></i>

            <span>الموقع</span>

        </a>


        <div class="footer">
            Alaa Basha Pharmacy
        </div>

    </div>

</body>
</html>
