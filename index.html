<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alaa Basha Pharmacy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;

      background-image:
        linear-gradient(rgba(225, 235, 229, 0.25),
                        rgba(225, 235, 229, 0.25)),
        url("58EDA103-ECF6-4AAC-BC7B-0AF4D7167867.jpeg");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .card {
      width: 100%;
      max-width: 470px;

      background: rgba(255, 255, 255, 0.93);

      border-radius: 30px;
      padding: 38px 22px 28px;

      box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    }

    .title {
      text-align: center;
      direction: ltr;
      color: #347b68;
      font-size: 34px;
      font-weight: 800;
      line-height: 1.15;
      margin: 0 0 12px;
    }

    .arabic-title {
      text-align: center;
      color: #355e51;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 18px;
      margin: 0 0 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      height: 68px;
      border-radius: 18px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;

      color: white;
      text-decoration: none;

      font-size: 20px;
      font-weight: bold;

      box-shadow: 0 5px 12px rgba(0,0,0,0.14);

      transition: transform 0.15s ease;
    }

    .link:active {
      transform: scale(0.97);
    }

    .icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Facebook */
    .facebook {
      background: #1877F2;
    }

    .facebook .icon {
      font-size: 34px;
      font-family: Arial;
      font-weight: bold;
    }

    /* Instagram */
    .instagram {
      background: linear-gradient(
        45deg,
        #f58529,
        #dd2a7b,
        #8134af,
        #515bd4
      );
    }

    .instagram .icon {
      border: 3px solid white;
      border-radius: 9px;
      position: relative;
    }

    .instagram .icon::before {
      content: "";
      width: 11px;
      height: 11px;
      border: 3px solid white;
      border-radius: 50%;
    }

    .instagram .icon::after {
      content: "";
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 4px;
      right: 4px;
    }

    /* WhatsApp */
    .whatsapp {
      background: #25D366;
    }

    .whatsapp .icon {
      border: 3px solid white;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      position: relative;
    }

    .whatsapp .icon::after {
      content: "☎";
      transform: rotate(-20deg);
    }

    /* TikTok */
    .tiktok {
      background: #111111;
    }

    .tiktok .icon {
      font-size: 31px;
      font-weight: bold;
      font-family: Arial;
    }

    .tiktok .icon::after {
      content: "♪";
    }

    /* Location */
    .location {
      background: #168f79;
    }

    .location .icon {
      position: relative;
    }

    .location .icon::before {
      content: "";
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      position: absolute;
    }

    .location .icon::after {
      content: "";
      width: 8px;
      height: 8px;
      background: #168f79;
      border-radius: 50%;
      position: absolute;
    }

    .footer {
      text-align: center;
      color: #91a39b;
      font-size: 15px;
      margin-top: 28px;
    }

    @media (max-width: 400px) {
      .title {
        font-size: 29px;
      }

      .arabic-title {
        font-size: 22px;
      }

      .link {
        height: 62px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1 class="title">
      Alaa Basha Pharmacy
    </h1>

    <div class="arabic-title">
      صيدلية د/ آلاء باشا
    </div>

    <p class="subtitle">
      تواصل معنا
    </p>

    <div class="links">

      <!-- Facebook -->
      <a
        class="link facebook"
        href="https://www.facebook.com/share/1DUipHWA5V/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">f</span>
        <span>Facebook</span>
      </a>

      <!-- Instagram -->
      <a
        class="link instagram"
        href="https://www.instagram.com/alaabasha.pharmacy?igsi=MXg5bDkwbDl6c2l6OQ%3D%3D&utm_source=qr"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon"></span>
        <span>Instagram</span>
      </a>

      <!-- WhatsApp -->
      <a
        class="link whatsapp"
        href="https://wa.me/201515112492"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon"></span>
        <span>WhatsApp</span>
      </a>

      <!-- TikTok -->
      <a
        class="link tiktok"
        href="https://www.tiktok.com/@dr.alaabasha.phar?_r=1&_t=ZS-99XmFtr2HmG"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon"></span>
        <span>TikTok</span>
      </a>

      <!-- Location -->
      <a
        class="link location"
        href="https://maps.app.goo.gl/DKWUxaxfdM81VhDk7?g_st=ic"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon"></span>
        <span>الموقع</span>
      </a>

    </div>

    <div class="footer">
      شكراً لاختيارك صيدلية دكتور آلاء باشا ❤️
    </div>

  </div>

</body>
</html>
